name: CI - Build, Test and Native Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Run unit tests
        shell: bash
        run: npx vitest run --reporter=verbose 2>&1 | tee test-output.txt
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-output
          path: test-output.txt
          retention-days: 5

  official-authoring:
    name: Official Authoring (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile, package and verify remediation on disposable runner
        shell: pwsh
        run: |
          $env:MC_NATIVE_TESTS = '1'
          $env:MC_NATIVE_RUNTIME = '1'
          $env:MC_NATIVE_REMEDIATE = '1'
          $env:MC_ARTIFACT_DIR = Join-Path $env:RUNNER_TEMP 'mc-official-artifacts'
          & .\scripts\restore.ps1 -CachePath (Join-Path $env:RUNNER_TEMP 'mc-official-modules')
          npx vitest run src/generators/__tests__/nativeCompiler.test.ts src/generators/__tests__/nativeRuntime.test.ts --no-file-parallelism
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-authoring-${{ matrix.os }}
          path: ${{ runner.temp }}/mc-official-artifacts
          retention-days: 5

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, official-authoring]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Post summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const jobs = [
              { name: 'Build & Unit Tests', result: '${{ needs.build-and-test.result }}' },
              { name: 'Native Windows + Linux Authoring', result: '${{ needs.official-authoring.result }}' },
            ];
            const allPassed = jobs.every(j => j.result === 'success');
            const rows = jobs.map(j => `| ${j.name} | ${j.result} |`).join('\n');
            const body = [
              `## ${allPassed ? '✅' : '❌'} CI Results`,
              '',
              '| Job | Status |',
              '|-----|--------|',
              rows,
              '',
              'Native jobs compile the catalog and templates, package and evaluate controlled fixtures, verify Set/Get, idempotence and drift correction, reject partial Set failures, and generate official policies.',
              '',
              `<sub>Run: [${context.runId}](${context.payload.repository.html_url}/actions/runs/${context.runId})</sub>`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body?.includes('## ✅ CI Results') || c.body?.includes('## ❌ CI Results'));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
      - name: Write job summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Unit Tests | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Native Windows + Linux Authoring | ${{ needs.official-authoring.result }} |" >> $GITHUB_STEP_SUMMARY
